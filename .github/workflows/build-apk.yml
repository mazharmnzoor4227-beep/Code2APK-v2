name: Build APK
run-name: Code2APK-${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Build job id
        required: true
        type: string

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify build job
        shell: bash
        run: |
          set -euo pipefail

          JOB="jobs/${{ inputs.build_id }}.zip"

          if [ ! -f "$JOB" ]; then
            echo "Build job not found: $JOB"
            exit 1
          fi

          echo "Build job found:"
          ls -lh "$JOB"

      - name: Extract build project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p buildsrc

          unzip -q \
            "jobs/${{ inputs.build_id }}.zip" \
            -d buildsrc

          echo "Extracted project:"
          find buildsrc -maxdepth 3 -type f | sort

      - name: Validate project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f buildsrc/meta.json ]; then
            echo "ERROR: meta.json missing"
            exit 1
          fi

          if [ ! -f buildsrc/www/index.html ]; then
            echo "ERROR: index.html missing"
            exit 1
          fi

          APP_NAME="$(node -p "require('./buildsrc/meta.json').appName")"
          APP_ID="$(node -p "require('./buildsrc/meta.json').appId")"

          if [ -z "$APP_NAME" ]; then
            echo "ERROR: App name missing"
            exit 1
          fi

          if [ -z "$APP_ID" ]; then
            echo "ERROR: Package ID missing"
            exit 1
          fi

          echo "App Name: $APP_NAME"
          echo "Package ID: $APP_ID"

      - name: Create Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail

          APP_NAME="$(node -p "require('./buildsrc/meta.json').appName")"
          APP_ID="$(node -p "require('./buildsrc/meta.json').appId")"

          mkdir -p capapp
          cd capapp

          npm init -y

          npm install \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android \
            @capacitor/assets

          cp -R ../buildsrc/www ./www

          mkdir -p assets

          if [ -f ../buildsrc/assets/icon.png ]; then
            cp ../buildsrc/assets/icon.png assets/icon.png
          fi

          if [ -f ../buildsrc/assets/icon.jpg ]; then
            cp ../buildsrc/assets/icon.jpg assets/icon.jpg
          fi

          if [ -f ../buildsrc/assets/icon.jpeg ]; then
            cp ../buildsrc/assets/icon.jpeg assets/icon.jpeg
          fi

          cat > capacitor.config.json <<EOF
          {
            "appId": "$APP_ID",
            "appName": "$APP_NAME",
            "webDir": "www",
            "android": {
              "allowMixedContent": true
            }
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Generate Android icon
        shell: bash
        run: |
          set -euo pipefail

          cd capapp

          if [ -f assets/icon.png ] || \
             [ -f assets/icon.jpg ] || \
             [ -f assets/icon.jpeg ]; then

            npx @capacitor/assets generate \
              --android || true

          else
            echo "No custom app icon uploaded."
          fi

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail

          cd capapp/android

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Locate generated APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          APK="$(find \
            capapp/android/app/build/outputs/apk/debug \
            -name '*.apk' \
            -type f \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK file not found"
            exit 1
          fi

          cp \
            "$APK" \
            "output/app-${{ inputs.build_id }}.apk"

          echo "APK created:"
          ls -lh output

      - name: Publish APK for direct download
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git pull \
            --rebase \
            origin \
            main

          mkdir -p downloads

          cp \
            "output/app-${{ inputs.build_id }}.apk" \
            "downloads/app-${{ inputs.build_id }}.apk"

          git add \
            "downloads/app-${{ inputs.build_id }}.apk"

          if [ -f "jobs/${{ inputs.build_id }}.zip" ]; then
            git rm \
              -f \
              "jobs/${{ inputs.build_id }}.zip"
          fi

          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit \
              -m \
              "Publish APK ${{ inputs.build_id }}"

            git push \
              origin \
              main
          fi

      - name: Upload APK artifact backup
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.build_id }}
          path: output/*.apk
          if-no-files-found: error
          retention-days: 3
